<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Project</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="card card-body">
      <button class="delete" aria-label="Supprimer">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="like" aria-label="Favori">
        <i class="fas fa-heart"></i>
      </button>

      <h3>Chaussures</h3>

      <button class="minus" aria-label="Diminuer">
        <i class="fas fa-minus-circle"></i>
      </button>
      <span class="quantity">1</span>
      <button class="plus" aria-label="Augmenter">
        <i class="fas fa-plus-circle"></i>
      </button>

      <p class="unit-price">120</p>
    </div>

    <div class="card card-body">
      <button class="delete" aria-label="Supprimer">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="like" aria-label="Favori">
        <i class="fas fa-heart"></i>
      </button>

      <h3>T-shirt</h3>

      <button class="minus" aria-label="Diminuer">
        <i class="fas fa-minus-circle"></i>
      </button>
      <span class="quantity">1</span>
      <button class="plus" aria-label="Augmenter">
        <i class="fas fa-plus-circle"></i>
      </button>

      <p class="unit-price">50</p>
    </div>

    <h2>Total : <span class="total">170</span> DT</h2>

    <script src="script.js"></script>
  </body>
</html>
